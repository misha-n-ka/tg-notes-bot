[project]
name = "notes-bot"
version = "0.1.0"
description = "Telegram bot for storing and finding text notes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["aiogram>=3.31,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "uv_build>=0.13.1,<0.14"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "notes_bot"
module-root = ""
source-include = ["tests/**"]

[tool.pytest.ini_options]
addopts = "--ignore=.env"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
